[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

# Configurazione per Edge Functions (ottimizzazione immagini)
[functions]
  node_bundler = "esbuild"

# Headers per cache ottimale delle immagini ottimizzate
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"